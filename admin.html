<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - DigiNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #fff; padding: 20px; }
        .admin-container { max-width: 600px; margin: 40px auto; background: #1e293b; padding: 25px; border-radius: 12px; }
        h2 { margin-bottom: 20px; color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #94a3b8; }
        input { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #38bdf8; color: #fff; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: #38bdf8; border: none; color: #0f172a; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>لوحة تحكم المالك</h2>
        <form id="addProductForm">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="prodName" required placeholder="أدخل اسم المنتج">
            </div>
            <div class="form-group">
                <label>السعر (USDT)</label>
                <input type="number" id="prodPrice" required placeholder="0.00">
            </div>
            <button type="submit">إضافة المنتج</button>
        </form>
    </div>

    <!-- مكتبة Supabase وملف app.js -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
