<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiNest - لوحة تحكم المالك الشاملة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            min-height: 100vh;
        }
        /* القائمة الجانبية للتحكم */
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            padding: 20px;
            border-left: 1px solid #334155;
        }
        .sidebar h2 { color: #38bdf8; margin-bottom: 30px; font-size: 20px; }
        .sidebar nav a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .sidebar nav a.active, .sidebar nav a:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        /* المحتوى الرئيسي */
        .main-content { flex: 1; padding: 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .stat-card h4 { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
        .stat-card p { font-size: 24px; font-weight: bold; color: #38bdf8; }
        
        .card {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
        }
        .card h3 { color: #38bdf8; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; color: #94a3b8; }
        .form-group input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #334155; background-color: #0f172a; color: #fff;
        }
        .btn-submit {
            padding: 12px 24px; background-color: #38bdf8;
            color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية للتحكم بالموقع -->
    <div class="sidebar">
        <h2>لوحة المالك ⚙️</h2>
        <nav>
            <a href="#" class="active">الرئيسية والإحصائيات</a>
            <a href="#">إدارة المنتجات</a>
            <a href="#">المبيعات والأرباح</a>
            <a href="#">إعدادات الموقع</a>
            <a href="index.html" style="margin-top: 50px; color: #ef4444;">العودة للمتجر ➔</a>
        </nav>
    </div>

    <!-- قسم التحكم الرئيسي -->
    <div class="main-content">
        <h2>مرحباً بك، المالك (Saer) 👋</h2>
        <p style="color: #94a3b8; margin-bottom: 25px;">إليك نظرة عامة على أداء موقعك والتحكم فيه:</p>

        <!-- ملخص إحصائيات الموقع -->
        <div class="stats-grid">
            <div class="stat-card">
                <h4>إجمالي المبيعات</h4>
                <p>$0.00 USDT</p>
            </div>
            <div class="stat-card">
                <h4>المنتجات المعروضة</h4>
                <p>3 منتجات</p>
            </div>
            <div class="stat-card">
                <h4>عدد الزوار</h4>
                <p>128 زائر</p>
            </div>
        </div>

        <!-- قسم إضافة منتج جديد -->
        <div class="card">
            <h3>إضافة منتج جديد للمتجر</h3>
            <form id="addProductForm">
                <div class="form-group">
                    <label>اسم المنتج الرقمي</label>
                    <input type="text" placeholder="مثال: قالب موقع إلكتروني" required>
                </div>
                <div class="form-group">
                    <label>السعر (USDT)</label>
                    <input type="number" step="0.01" placeholder="10.00" required>
                </div>
                <button type="submit" class="btn-submit">نشر المنتج في المتجر</button>
            </form>
        </div>
    </div>

</body>
</html>
