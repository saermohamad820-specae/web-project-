<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DigiNest | المتجر الرقمي اللامركزي للمنتجات الرقمية والمدفوعات المشفرة</title>
  
  <!-- SEO & OpenGraph -->
  <meta name="description" content="DigiNest - سوق لامركزي لبيع وشراء المنتجات الرقمية والبرمجيات وقوالب الذكاء الاصطناعي بدفع فوري بالعملات المشفرة مع تسليم فوري وتراخيص مؤكدة.">
  <meta name="theme-color" content="#0B0F17">

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090E;
      --bg-surface: #0E131F;
      --bg-card: #141B2D;
      --bg-card-hover: #1A243B;
      --border-subtle: #242E47;
      --border-focus: #10B981;
      
      --emerald-500: #10B981;
      --emerald-400: #34D399;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      
      --amber-400: #FBBF24;
      --cyan-400: #22D3EE;
      --purple-400: #A78BFA;
      
      --text-primary: #F9FAFB;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      
      --font-ar: 'Tajawal', sans-serif;
      --font-en: 'Inter', sans-serif;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ar);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    @media (min-width: 768px) {
      body {
        padding-bottom: 0;
      }
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: #242E47; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #374151; }

    /* Top Announcement Bar */
    .top-announcement {
      background: linear-gradient(90deg, #059669, #10B981, #0284C7);
      color: #064E3B;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 15px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .top-announcement span {
      background: rgba(255, 255, 255, 0.25);
      padding: 2px 8px;
      border-radius: 20px;
      color: #064E3B;
    }

    /* Header */
    header {
      background: rgba(14, 19, 31, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px 18px;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10B981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #FFFFFF;
      box-shadow: 0 0 16px var(--emerald-glow);
    }

    .brand-title h1 {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: -0.3px;
      line-height: 1.1;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span.tag {
      font-size: 10px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-400);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Search Bar in Header (Desktop) */
    .header-search {
      flex: 1;
      max-width: 440px;
      position: relative;
      display: none;
    }
    @media (min-width: 768px) {
      .header-search { display: block; }
    }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 42px 10px 14px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      border-color: var(--emerald-500);
      box-shadow: 0 0 0 3px var(--emerald-glow);
      background: var(--bg-card);
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    /* Header Action Buttons */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #032E21;
      box-shadow: 0 4px 14px var(--emerald-glow);
    }
    .btn-emerald:hover {
      background: linear-gradient(135deg, #34D399, #10B981);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: #374151;
    }

    /* Sub-nav Tabs (Desktop) */
    .nav-tabs-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: none;
      padding: 0 20px;
    }
    @media (min-width: 768px) {
      .nav-tabs-bar {
        display: flex;
        justify-content: center;
        gap: 8px;
      }
    }

    .nav-tab-item {
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .nav-tab-item:hover { color: #FFFFFF; }
    .nav-tab-item.active {
      color: var(--emerald-400);
      border-bottom-color: var(--emerald-500);
      background: rgba(16, 185, 129, 0.05);
    }

    /* Main Container */
    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 16px;
      width: 100%;
      flex: 1;
    }

    .mobile-search-box {
      margin-bottom: 18px;
      position: relative;
    }
    @media (min-width: 768px) {
      .mobile-search-box { display: none; }
    }

    /* Hero Section */
    .hero-banner {
      background: radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.15), transparent 50%),
                  radial-gradient(circle at 0% 100%, rgba(34, 211, 238, 0.08), transparent 55%),
                  var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .hero-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: var(--emerald-400);
      padding: 5px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 16px;
    }

    .hero-banner h2 {
      font-size: 26px;
      font-weight: 900;
      line-height: 1.35;
      margin-bottom: 10px;
    }
    @media (min-width: 640px) {
      .hero-banner h2 { font-size: 34px; }
    }

    .hero-banner p {
      color: var(--text-secondary);
      font-size: 14px;
      max-width: 640px;
      margin: 0 auto 20px;
      line-height: 1.65;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-badge {
      background: rgba(20, 27, 45, 0.8);
      border: 1px solid var(--border-subtle);
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #E2E8F0;
    }
    .stat-badge i { color: var(--emerald-400); }

    /* Categories Horizontal Scroll */
    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
      -webkit-overflow-scrolling: touch;
    }
    .category-chip {
      white-space: nowrap;
      padding: 9px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .category-chip.active {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.05));
      border-color: var(--emerald-500);
      color: var(--emerald-400);
    }

    /* Section Headers */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }
    .section-header h3 {
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header span.count {
      font-size: 12px;
      color: var(--text-muted);
      background: var(--bg-surface);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-subtle);
    }

    /* Products Grid */
    .products-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 600px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 992px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1200px) { .products-grid { grid-template-columns: repeat(4, 1fr); } }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: all 0.25s ease;
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-4px);
      border-color: #384566;
    }

    .card-banner {
      height: 150px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
    }
    .card-banner.ai { background: linear-gradient(135deg, #1E1B4B, #312E81); }
    .card-banner.ui { background: linear-gradient(135deg, #064E3B, #065F46); }
    .card-banner.code { background: linear-gradient(135deg, #3730A3, #1E293B); }
    .card-banner.finance { background: linear-gradient(135deg, #78350F, #92400E); }
    .card-banner.web3 { background: linear-gradient(135deg, #4C1D95, #5B21B6); }

    .category-tag {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(14, 19, 31, 0.85);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #FFFFFF;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .rating-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(14, 19, 31, 0.85);
      backdrop-filter: blur(6px);
      color: var(--amber-400);
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .card-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #FFFFFF;
    }

    .card-desc {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      flex: 1;
    }

    .card-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(36, 46, 71, 0.7);
    }
    .card-meta span { display: flex; align-items: center; gap: 4px; }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .fiat-amount {
      font-size: 18px;
      font-weight: 900;
      color: var(--emerald-400);
      font-family: var(--font-en);
    }
    .crypto-amount {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 700;
    }

    /* Modal Overlays */
    .custom-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(10px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .custom-modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      max-width: 460px;
      width: 100%;
      padding: 24px;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #10B981;
      color: #032E21;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      z-index: 2000;
      display: none;
      box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4);
    }

    /* Mobile Bottom Navigation Bar */
    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 19, 31, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      padding: 8px 10px;
      z-index: 50;
    }
    @media (min-width: 768px) {
      .mobile-bottom-nav { display: none; }
    }

    .bottom-nav-item {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .bottom-nav-item i { font-size: 18px; }
    .bottom-nav-item.active { color: var(--emerald-400); }

    /* Footer */
    footer {
      background: var(--bg-surface);
