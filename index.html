<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DigiNest | المتجر الرقمي اللامركزي للمنتجات الرقمية والمدفوعات المشفرة</title>
  
  <meta name="description" content="DigiNest - سوق لامركزي لبيع وشراء المنتجات الرقمية والبرمجيات وقوالب الذكاء الاصطناعي بدفع فوري بالعملات المشفرة مع تسليم فوري وتراخيص مؤكدة.">
  <meta name="theme-color" content="#0B0F17">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090E;
      --bg-surface: #0E131F;
      --bg-card: #141B2D;
      --bg-card-hover: #1A243B;
      --border-subtle: #242E47;
      --border-focus: #10B981;
      --emerald-500: #10B981;
      --emerald-400: #34D399;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --amber-400: #FBBF24;
      --text-primary: #F9FAFB;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --font-ar: 'Tajawal', sans-serif;
      --font-en: 'Inter', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ar);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 70px;
    }

    @media (min-width: 768px) {
      body { padding-bottom: 0; }
    }

    .top-announcement {
      background: linear-gradient(90deg, #059669, #10B981, #0284C7);
      color: #064E3B;
      font-size: 12px;
      font-weight: 800;
      padding: 6px 15px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .top-announcement span {
      background: rgba(255, 255, 255, 0.25);
      padding: 2px 8px;
      border-radius: 20px;
      color: #064E3B;
    }

    header {
      background: rgba(14, 19, 31, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 12px 18px;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, #10B981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #FFFFFF;
      box-shadow: 0 0 16px var(--emerald-glow);
    }

    .brand-title h1 {
      font-size: 19px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-title span.tag {
      font-size: 10px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-400);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1px 6px;
      border-radius: 4px;
    }

    .brand-title p {
      font-size: 11px;
      color: var(--text-muted);
    }

    .header-search {
      flex: 1;
      max-width: 440px;
      position: relative;
      display: none;
    }
    @media (min-width: 768px) { .header-search { display: block; } }

    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 42px 10px 14px;
      color: var(--text-primary);
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--emerald-500);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 9px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #032E21;
      box-shadow: 0 4px 14px var(--emerald-glow);
    }
    .btn-emerald:hover { background: linear-gradient(135deg, #34D399, #10B981); }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }
    .btn-secondary:hover { background: var(--bg-card); }

    .nav-tabs-bar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-subtle);
      display: none;
      padding: 0 20px;
    }
    @media (min-width: 768px) {
      .nav-tabs-bar { display: flex; justify-content: center; gap: 8px; }
    }

    .nav-tab-item {
      padding: 12px 20px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-secondary);
      background: transparent;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .nav-tab-item.active {
      color: var(--emerald-400);
      border-bottom-color: var(--emerald-500);
      background: rgba(16, 185, 129, 0.05);
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 24px 16px;
      width: 100%;
      flex: 1;
    }

    .hero-banner {
      background: radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.15), transparent 50%), var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 28px;
    }
    .hero-banner h2 { font-size: 26px; font-weight: 900; margin-bottom: 10px; }
    .hero-banner p { color: var(--text-secondary); font-size: 14px; max-width: 640px; margin: 0 auto 20px; line-height: 1.6; }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 24px;
    }
    .category-chip {
      white-space: nowrap;
      padding: 9px 18px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 30px;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .category-chip.active {
      background: rgba(16, 185, 129, 0.15);
      border-color: var(--emerald-500);
      color: var(--emerald-400);
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 600px) { .products-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 992px) { .products-grid { grid-template-columns: repeat(3, 1fr); } }

    .product-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 16px;
    }
    .product-card h3 { font-size: 16px; margin: 10px 0; color: #FFF; }
    .product-card p { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
    .product-card .price { font-size: 18px; font-weight: 900; color: var(--emerald-400); }

    .custom-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(10px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .custom-modal-content {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 20px;
      max-width: 460px;
      width: 100%;
      padding: 24px;
      position: relative;
    }

    .toast-msg {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: #10B981;
      color: #032E21;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 800;
      z-index: 200;
      display: none;
    }

    .mobile-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(14, 19, 31, 0.96);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 50;
    }
    @media (min-width: 768px) { .mobile-bottom-nav { display: none; } }
    .bottom-nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .bottom-nav-item.active { color: var(--emerald-400); }
  </style>
</head>
<body>

  <div class="top-announcement">
    <span>عمولة 3% فقط</span> بوابة الدفع الذكية بالعملات المشفرة مع تسليم فوري وتلقائي للملفات الرقمية 🚀
  </div>

  <header>
    <div class="header-inner">
      <a href="#" class="brand-logo">
        <div class="brand-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div class="brand-title">
          <h1>DigiNest <span class="tag">Web3</span></h1>
          <p>سوق المنتجات الرقمية اللامركزي</p>
        </div>
      </a>
      <a href="#" class="btn btn-secondary" onclick="openLoginModal(event)">تسجيل الدخول</a>
      
      <div class="header-search">
        <input type="text" class="search-input" id="desktop-search" placeholder="ابحث عن المنتجات الرقمية..." oninput="handleSearch(this.value)">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>
      </div>

      <div class="header-actions">
        <button class="btn btn-emerald" id="connect-wallet-btn" onclick="handleWalletConnect()">
          <i class="fa-solid fa-wallet"></i>
          <span id="wallet-text">ربط المحفظة</span>
        </button>
      </div>
    </div>
  </header>

  <nav class="nav-tabs-bar">
    <button class="nav-tab-item active" onclick="switchMainTab('tab-explore', this)">
      <i class="fa-solid fa-compass"></i> تصفح السوق
    </button>
    <button class="nav-tab-item" onclick="switchMainTab('tab-studio', this)">
      <i class="fa-solid fa-store"></i> استوديو البائع
    </button>
    <button class="nav-tab-item" onclick="switchMainTab('tab-library', this)">
      <i class="fa-solid fa-box-open"></i> مشترياتي الرقمية
    </button>
  </nav>

  <main>
    <div id="tab-explore">
      <section class="hero-banner
