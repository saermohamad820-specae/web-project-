<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DigiNest | المتجر الرقمي اللامركزي</title>
  
  <meta name="description" content="DigiNest - سوق لامركزي لبيع وشراء المنتجات الرقمية والبرمجيات مع نظام اشتراك شهري للبائعين.">
  <meta name="theme-color" content="#0B0F17">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #07090E;
      --bg-surface: #0E131F;
      --bg-card: #141B2D;
      --border-subtle: #242E47;
      --emerald-500: #10B981;
      --emerald-400: #34D399;
      --emerald-glow: rgba(16, 185, 129, 0.25);
      --amber-400: #FBBF24;
      --text-primary: #F9FAFB;
      --text-secondary: #94A3B8;
      --text-muted: #64748B;
      --font-ar: 'Tajawal', sans-serif;
      --radius-md: 12px;
      --radius-xl: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ar);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 90px;
    }

    .top-announcement {
      background: linear-gradient(90deg, #059669, #10B981, #0284C7);
      color: #064E3B;
      font-size: 11px;
      font-weight: 800;
      padding: 8px 12px;
      text-align: center;
    }

    header {
      background: rgba(14, 19, 31, 0.92);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-subtle);
      position: sticky;
      top: 0;
      z-index: 40;
      padding: 10px 14px;
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      color: inherit;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #10B981, #047857);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      color: #FFFFFF;
      box-shadow: 0 0 12px var(--emerald-glow);
    }

    .brand-title h1 {
      font-size: 15px;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .brand-title span.tag {
      font-size: 8px;
      font-weight: 800;
      background: rgba(16, 185, 129, 0.15);
      color: var(--emerald-400);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 1px 4px;
      border-radius: 4px;
    }

    .brand-title p {
      font-size: 9px;
      color: var(--text-muted);
    }

    .btn {
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn-emerald {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #032E21;
      box-shadow: 0 4px 12px var(--emerald-glow);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
    }

    main {
      max-width: 1240px;
      margin: 0 auto;
      padding: 14px 12px;
      width: 100%;
      flex: 1;
    }

    .search-box {
      margin-bottom: 16px;
      position: relative;
    }
    .search-input {
      width: 100%;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 10px 38px 10px 14px;
      color: var(--text-primary);
      font-size: 12px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--emerald-500);
      box-shadow: 0 0 0 3px var(--emerald-glow);
    }
    .search-icon {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      font-size: 13px;
    }

    .hero-banner {
      background: radial-gradient(circle at 100% 0%, rgba(16, 185, 129, 0.15), transparent 50%), var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 20px 14px;
      text-align: center;
      margin-bottom: 16px;
    }
    .hero-banner h2 { font-size: 20px; font-weight: 900; margin-bottom: 8px; line-height: 1.4; }
       function loadProducts() {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;

      const customProducts = JSON.parse(localStorage.getItem('diginest_products') || '[]');
      const allProducts = [...INITIAL_PRODUCTS, ...customProducts];

      const filtered = allProducts.filter(p => {
        const matchesCat = currentCategory === 'all' || p.category === currentCategory;
        const matchesSearch = p.title.toLowerCase().includes(searchTerm.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center; padding: 20px; font-size: 11px;">لا توجد منتجات مطابقة.</p>';
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="product-card">
          <h3>${p.title}</h3>
          <p>${p.description || 'بدون وصف'}</p>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 8px; border-top: 1px solid rgba(36,46,71,0.5);">
            <span class="price">${p.price}</span>
            <button class="btn btn-emerald" style="padding: 4px 10px; font-size: 10px;" onclick="buyProduct('${p.id}', '${p.title}')">شراء</button>
          </div>
        </div>
      `).join('');
    }

    function buyProduct(id, title) {
      let purchased = JSON.parse(localStorage.getItem('user_library') || '[]');
      if (!purchased.some(item => item.id === id)) {
        purchased.push({ id, title, date: new Date().toLocaleDateString('ar') });
        localStorage.setItem('user_library', JSON.stringify(purchased));
      }
      showToast(`تم شراء "${title}" بنجاح!`);
      loadUserLibrary();
    }

    function loadUserLibrary() {
      const libraryContainer = document.getElementById('user-purchased-items');
      if (!libraryContainer) return;

      const purchased = JSON.parse(localStorage.getItem('user_library') || '[]');
      if (purchased.length === 0) {
        libraryContainer.innerHTML = 'لم تقم بشراء أي منتج حتى الآن.';
        return;
      }

      libraryContainer.innerHTML = purchased.map(item => `
        <div style="background: var(--bg-card); padding: 8px; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border-subtle);">
          <div>
            <strong style="color: #FFF; font-size: 11px;">${item.title}</strong>
            <div style="font-size: 9px; color: var(--text-muted);">تاريخ الشراء: ${item.date}</div>
          </div>
          <button class="btn btn-emerald" style="padding: 3px 8px; font-size: 9px;" onclick="showToast('جاري التحميل...')">تحميل</button>
        </div>
      `).join('');
    }

    function handleWalletConnect() {
      if (window.ethereum) {
        window.ethereum.request({ method: 'eth_requestAccounts' })
          .then(accs => {
            const short = accs[0].substring(0, 6) + '...' + accs[0].substring(accs[0].length - 4);
            document.getElementById('wallet-main-text').innerText = short;
            showToast('تم ربط المحفظة: ' + short);
          })
          .catch(() => showToast('تم إلغاء الاتصال'));
      } else {
        document.getElementById('wallet-main-text').innerText = '0x71C5...498a';
        showToast('تم ربط المحفظة الوهمية بنجاح!');
      }
    }
  </script>
</body>
</html>
