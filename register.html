<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب جديد - DigiNest</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: #0b111e;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #121b2d;
      border: 1px solid #334155;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,.35);
    }

    h1 {
      font-size: 24px;
      color: #10b981;
      margin-bottom: 24px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      color: #94a3b8;
    }

    input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0b1321;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      outline: 1px solid #10b981;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #10b981;
      color: #07131a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-top: 8px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      font-size: 14px;
      line-height: 1.7;
      overflow-wrap: anywhere;
    }

    .links {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
      color: #94a3b8;
    }

    a {
      color: #10b981;
      text-decoration: none;
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>إنشاء حساب جديد</h1>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">الاسم الكامل</label>
        <input
          id="fullName"
          name="fullName"
          type="text"
          placeholder="أدخل اسمك الكامل"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input
          id="email"
          name="email"
          type="email"
          placeholder="example@mail.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input
          id="password"
          name="password"
          type="password"
          placeholder="8 أحرف على الأقل"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <button id="registerButton" type="submit">
        إنشاء الحساب
      </button>

      <p id="message" role="status" aria-live="polite"></p>
    </form>

    <div class="links">
      لديك حساب بالفعل؟
      <a href="login.html">تسجيل الدخول</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = "https://xxfykrtdhsyqtmizvgav.supabase.co";

    // يستخدم المفتاح العام نفسه الموجود في app.js.
    // لا تضع هنا service_role أو أي مفتاح سري.
    const SUPABASE_KEY = "sb_publishable_I1ru_zUVcgszKrCGc4u6wQ_L1BZ9hPh";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!fullName) {
        message.textContent = "يرجى إدخال الاسم الكامل.";
        return;
      }

      button.disabled = true;
      button.textContent = "جارٍ إنشاء الحساب...";
      message.textContent = "";

      try {
        const { data, error } = await client.auth.signUp({
          email: email,
          password: password,
          options: {
            data: {
              full_name: fullName
            }
          }
        });

        if (error) {
          message.textContent = "تعذر إنشاء الحساب: " + error.message;
          return;
        }

        if (data.user && !data.session) {
          message.textContent =
            "تم إنشاء الحساب. تحقق من بريدك الإلكتروني لتأكيده، ثم سجّل الدخول.";
          return;
        }

        if (data.session) {
          message.textContent = "تم إنشاء الحساب بنجاح! جارٍ الانتقال...";
          window.location.href = "index.html";
        } else {
          message.textContent =
            "تم إرسال طلب إنشاء الحساب. تحقق من بريدك الإلكتروني.";
        }

      } catch (error) {
        console.error("خطأ في التسجيل:", error);
        message.textContent =
          "حدث خطأ في الاتصال. تحقق من الإنترنت وحاول مجددًا.";
      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>
</body>
</html>
