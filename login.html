<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - DigiNest</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b111e; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-container { background-color: #121b2d; border-radius: 12px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5); width: 90%; max-width: 400px; padding: 30px; text-align: center; border: 1px solid #1e293b; }
        h2 { color: #00ffaa; margin-bottom: 25px; font-size: 24px; }
        .form-group { margin-bottom: 18px; text-align: right; }
        label { font-size: 14px; color: #94a3b8; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #1e2d42; background-color: #0b1321; color: #ffffff; font-size: 14px; outline: none; }
        input:focus { border-color: #00ffaa; }
        .submit-btn { width: 100%; padding: 12px; border-radius: 8px; border: none; background-color: #00ffaa; color: #0b111e; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .submit-btn:hover { background-color: #00cc88; }
        .links-container { margin-top: 20px; font-size: 14px; color: #94a3b8; line-height: 1.8; }
        .links-container a { color: #00ffaa; text-decoration: none; }
        .links-container a:hover { text-decoration: underline; }
        .admin-link { margin-top: 15px; padding-top: 15px; border-top: 1px solid #1e293b; font-size: 13px; }
        .admin-link a { color: #64748b; font-weight: 500; }
        .admin-link a:hover { color: #f59e0b; }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>تسجيل الدخول</h2>

        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني أو اسم المستخدم</label>
                <input type="text" placeholder="أدخل اسم المستخدم" required>
            </div>

            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="أدخل كلمة المرور" required>
            </div>

            <button type="submit" class="submit-btn">دخول</button>
        </form>

        <div class="links-container">
            ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a>
            
            <div class="admin-link">
                <a href="admin.html"><i class="fa-solid fa-user-shield"></i> دخول المالك / الإدارة</a>
            </div>
        </div>
    </div>
<!-- مكتبة Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- ملف التوصيل والبرمجة -->
<script src="app.js"></script>

</body>
</html>
